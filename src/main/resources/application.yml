spring:
  profiles:
    active: prod
  application:
    name: springboot-init
  # Spring AI 配置
  ai:
    openai:
      api-key: ${AI_OPENAI_API_KEY:mock-key-for-init}
      base-url: ${AI_OPENAI_BASE_URL:https://api.deepseek.com}
    mcp:
      server:
        name: ownai-design-assistant
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 220MB
      max-request-size: 220MB

server:
  port: 8011
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

video:
  watermark:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    logo-path: ${VIDEO_WATERMARK_LOGO_PATH:classpath:watermark/ownai-logo.png}
    timeout-seconds: ${VIDEO_WATERMARK_TIMEOUT_SECONDS:600}

site:
  analytics:
    hash-secret: ${SITE_ANALYTICS_HASH_SECRET:ownai-site-analytics-local}
    aggregate-cron: ${SITE_ANALYTICS_AGGREGATE_CRON:0 */5 * * * ?}
    cleanup-cron: ${SITE_ANALYTICS_CLEANUP_CRON:0 30 3 * * ?}

codex:
  reset-monitor:
    enabled: ${CODEX_RESET_MONITOR_ENABLED:true}
    source-url: ${CODEX_RESET_MONITOR_SOURCE_URL:https://betteropc.com/ai-products/reset-signals/codex}
    history-url: ${CODEX_RESET_MONITOR_HISTORY_URL:https://betteropc.com/api/browser/product-tracking/codex/history}
    history-months: ${CODEX_RESET_MONITOR_HISTORY_MONTHS:12}
    refresh-interval-ms: ${CODEX_RESET_MONITOR_REFRESH_INTERVAL_MS:600000}
    initial-delay-ms: ${CODEX_RESET_MONITOR_INITIAL_DELAY_MS:3000}
    request-timeout-ms: ${CODEX_RESET_MONITOR_REQUEST_TIMEOUT_MS:15000}
    stale-after-ms: ${CODEX_RESET_MONITOR_STALE_AFTER_MS:1800000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
