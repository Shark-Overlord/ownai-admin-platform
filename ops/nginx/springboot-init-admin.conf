server {
    listen 80;
    server_name admin.ownai.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.ownai.icu;
    client_max_body_size 200m;

    root /www/wwwroot/springboot-init-admin;
    index index.html;

    access_log /www/wwwlogs/springboot-init-admin.access.log;
    access_log /www/wwwlogs/springboot-init-admin.evidence.log ownai_evidence;
    error_log /www/wwwlogs/springboot-init-admin.error.log;

    ssl_certificate /www/server/nginx/ssl/admin.ownai.icu/admin.ownai.icu.pem;
    ssl_certificate_key /www/server/nginx/ssl/admin.ownai.icu/admin.ownai.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /uploads/ {
        alias /opt/springboot-init/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
