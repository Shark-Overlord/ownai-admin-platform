server {
    listen 80;
    server_name de.ownai.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name de.ownai.icu;

    root /www/wwwroot/de-migration;
    index index.html;
    charset utf-8;

    access_log /www/wwwlogs/de-ownai-migration.access.log;
    access_log /www/wwwlogs/de-ownai-migration.evidence.log ownai_evidence;
    error_log /www/wwwlogs/de-ownai-migration.error.log;

    ssl_certificate /www/server/nginx/ssl/de.ownai.icu/de.ownai.icu.pem;
    ssl_certificate_key /www/server/nginx/ssl/de.ownai.icu/de.ownai.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /api/ {
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
