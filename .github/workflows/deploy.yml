name: Deploy Spring Boot app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: springboot-init-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 101.200.91.81
      DEPLOY_USER: deploy
      BACKEND_PATH: /opt/springboot-init
      ADMIN_FRONTEND_PATH: /www/wwwroot/springboot-init-admin
      PUBLIC_FRONTEND_PATH: /www/wwwroot/ownai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-admin/package-lock.json
            web-frontend/package-lock.json

      - name: Build admin frontend
        working-directory: web-admin
        run: |
          npm ci
          npm run build

      - name: Build public frontend
        working-directory: web-frontend
        run: |
          npm ci
          npm run build

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Backup current production release
        run: |
          RELEASE_BACKUP_PATH="$BACKEND_PATH/releases/${GITHUB_RUN_ID}-${GITHUB_SHA}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; mkdir -p '$RELEASE_BACKUP_PATH'; cp -p '$BACKEND_PATH/app.jar' '$RELEASE_BACKUP_PATH/app.jar.before'; tar -czf '$RELEASE_BACKUP_PATH/admin.before.tar.gz' -C '$ADMIN_FRONTEND_PATH' .; tar -czf '$RELEASE_BACKUP_PATH/frontend.before.tar.gz' -C '$PUBLIC_FRONTEND_PATH' .; sha256sum '$RELEASE_BACKUP_PATH/app.jar.before' '$RELEASE_BACKUP_PATH/admin.before.tar.gz' '$RELEASE_BACKUP_PATH/frontend.before.tar.gz' > '$RELEASE_BACKUP_PATH/before.sha256'"
          echo "RELEASE_BACKUP_PATH=$RELEASE_BACKUP_PATH" >> "$GITHUB_ENV"
          echo "Production backup: \`$RELEASE_BACKUP_PATH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend jar
        timeout-minutes: 15
        run: |
          JAR_FILE="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"
          test -n "$JAR_FILE"
          rsync -r --partial --append-verify --timeout=120 --info=progress2 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            "$JAR_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_PATH/app.jar.tmp"

      - name: Activate backend jar
        timeout-minutes: 3
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; mv '$BACKEND_PATH/app.jar.tmp' '$BACKEND_PATH/app.jar'; sudo systemctl restart springboot-init; sudo systemctl is-active springboot-init"

      - name: Deploy admin frontend
        run: |
          rsync -r --exclude=index.html --no-times --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-admin/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$ADMIN_FRONTEND_PATH/"
          rsync -r --no-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-admin/dist/index.html "$DEPLOY_USER@$DEPLOY_HOST:$ADMIN_FRONTEND_PATH/index.html.next"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 644 '$ADMIN_FRONTEND_PATH/index.html.next' && mv '$ADMIN_FRONTEND_PATH/index.html.next' '$ADMIN_FRONTEND_PATH/index.html'"
          rsync -r --delete --exclude=index.html --no-times --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-admin/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$ADMIN_FRONTEND_PATH/"

      - name: Deploy public frontend
        run: |
          rsync -r --exclude=index.html --no-times --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_FRONTEND_PATH/"
          rsync -r --no-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-frontend/dist/index.html "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_FRONTEND_PATH/index.html.next"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 644 '$PUBLIC_FRONTEND_PATH/index.html.next' && mv '$PUBLIC_FRONTEND_PATH/index.html.next' '$PUBLIC_FRONTEND_PATH/index.html'"
          rsync -r --delete --exclude=index.html --no-times --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web-frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_FRONTEND_PATH/"

      - name: Record deployed hashes and rollback command
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sha256sum '$BACKEND_PATH/app.jar' '$ADMIN_FRONTEND_PATH/index.html' '$PUBLIC_FRONTEND_PATH/index.html' | tee '$RELEASE_BACKUP_PATH/deployed.sha256'" \
            | tee deployed.sha256
          {
            echo '### Deployment evidence'
            echo
            echo '```text'
            cat deployed.sha256
            echo '```'
            echo
            echo 'Rollback command:'
            echo '```bash'
            echo "ssh $DEPLOY_USER@$DEPLOY_HOST \"cp -p '$RELEASE_BACKUP_PATH/app.jar.before' '$BACKEND_PATH/app.jar' && tar -xzf '$RELEASE_BACKUP_PATH/admin.before.tar.gz' -C '$ADMIN_FRONTEND_PATH' && tar -xzf '$RELEASE_BACKUP_PATH/frontend.before.tar.gz' -C '$PUBLIC_FRONTEND_PATH' && find '$ADMIN_FRONTEND_PATH' '$PUBLIC_FRONTEND_PATH' -type d -exec chmod 755 {} + && find '$ADMIN_FRONTEND_PATH' '$PUBLIC_FRONTEND_PATH' -type f -exec chmod 644 {} + && sudo systemctl restart springboot-init\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
